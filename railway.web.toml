# Web API service (stock_ai on Railway).
#
# Railway service settings:
#   Root Directory: /  (repo root — NOT backend/)
#   Config file:    railway.web.toml
#   Variables:      GEMINI_API_KEY, DOSSIER_API_URL, DOSSIER_API_TOKEN,
#                   KITE_API_KEY, KITE_API_SECRET (read token from Supabase)
#                   SUPABASE_DATABASE_URL (health dashboard + kite_auth_tokens)
#                   FRONTEND_URL, APP_REDIRECT_URL, DASHBOARD_SESSION_SECRET,
#                   AUTHORIZED_EMAIL, SUPABASE_ANON_KEY, SUPABASE_PROJECT_URL
#
# Kite token: TOTP refresh runs on your Mac (not Railway — Zerodha blocks cloud
# login). Local cron syncs to Supabase kite_auth_tokens; stock_ai reads it.
#
# In-process schedulers (Supabase wolves only):
#   WOLF_EVENING_CRON  default 30 11 * * mon-fri  (~5:00 PM IST weekdays)
#   WOLF_DAILY_CRON    default 25 3 * * mon-fri   (~8:55 AM IST weekdays)
#   Auto-on when RAILWAY_ENVIRONMENT is set.
#
# Morning screening runs on data-layer-cron (railway.json), not this service.

[build]
builder = "NIXPACKS"
buildCommand = "pip install -r backend/requirements.txt"

[deploy]
startCommand = "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
numReplicas = 1
